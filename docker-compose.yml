services:
  jupyter:
    build: .
    container_name: projet7_jupyter
    working_dir: /workspace
    restart: unless-stopped
    volumes:
      - .:/workspace
    ports:
      - "8888:8888"
      - "6006:6006"
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --ServerApp.token=''
      --ServerApp.password=''
