name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r huggingface_space/requirements.txt
          pip install pytest==8.3.3
      # Les tests "slow" (chargent de vrais checkpoints) ne sont pas lances
      # en CI : pas de .pt dans le repo. Les autres passent sans DB ni reseau.
      - name: Run pytest (sans slow)
        env:
          DATABASE_URL: ""
          DATA_POSTGRESQL: ""
        run: pytest tests/ -q -m "not slow and not integration"

  docker-build:
    name: Docker build dry-run (HF Space image)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build sans push, juste pour verifier que le Dockerfile est bon.
      # Les checkpoints sont tires depuis HF Hub au boot, pas copies ici.
      - uses: docker/build-push-action@v6
        with:
          context: ./huggingface_space
          push: false
          tags: ltsf-space:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
